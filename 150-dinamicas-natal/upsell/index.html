<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oferta Especial - Upsell</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Utmify Pixel -->
    <script>
      window.pixelId = "692fc1003cbde1d1ecb286a4";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
    </script>

    <!-- Utmify UTMs Script -->
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>
</head>
<body>
    <!-- SEÇÃO PRINCIPAL -->
    <section class="upsell-hero">
        <div class="container">
            <h1 class="headline">
                ESPERE! NÃO FECHE ESTA PÁGINA
            </h1>

            <!-- Espaço para VSL -->
            <div class="vsl-container">
                <div class="vimeo-wrapper">
                    <iframe
                        src="https://player.vimeo.com/video/1143731078?badge=0&autopause=0&player_id=0&app_id=58479&title=0&byline=0&portrait=0"
                        frameborder="0"
                        allow="autoplay; fullscreen; picture-in-picture; clipboard-write"
                        title="65 Melhores Dinâmicas em Vídeo">
                    </iframe>
                    <div class="vimeo-menu-cover"></div>
                </div>
                <script src="https://player.vimeo.com/api/player.js"></script>
            </div>

            <!-- CTA Button -->
            <a href="https://pay.lowify.com.br/checkout?product_id=VPrlCj" class="btn-cta pulse">
                SIM! GARANTIR ESTA OFERTA AGORA 🎁
            </a>

            <!-- Botão Não Obrigado -->
            <div class="no-thanks">
                <a href="https://receitinhaspratodahora.shop/150-dinamicas-natal/obrigado.html" class="btn-decline">
                    Não, obrigado. Quero continuar sem esta oferta.
                </a>
            </div>
        </div>
    </section>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
